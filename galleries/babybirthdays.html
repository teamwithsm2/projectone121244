<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>معرض صور عيد ميلاد اطفال | Nour Photography</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    

</head>

<body class="gallery-page">

    
    <main class="graduation-gallery">

        <header class="gallery-header">

            <a href="../index.html#portfolio" class="gallery-back">
                <i class="fas fa-arrow-right"></i>
                العودة إلى الأعمال
            </a>

            <h1 class="gallery-title">لحظات اعياد ميلاد اطفال</h1>

            <p class="gallery-subtitle">
                تفاصيل جميلة وذكريات تستحق أن تبقى للأبد
            </p>

            <div class="gallery-decoration"></div>

        </header>

        
        <section class="photo-grid" id="babyBirthdayGallery" aria-label="صور عيد ميلاد الأطفال">
        
            <p id="galleryStatus" role="status" aria-live="polite">
                جارٍ تحميل الصور...
            </p>
        
        </section>
        

    </main>

    <!-- نافذة تكبير الصور -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصورة بحجم كبير">

        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="إغلاق">
            &times;
        </button>

        <button class="lightbox-prev" id="lightboxPrev" type="button" aria-label="الصورة السابقة">
            <i class="fas fa-chevron-right"></i>
        </button>

        <img class="lightbox-image" id="lightboxImage" src="" alt="">

        <button class="lightbox-next" id="lightboxNext" type="button" aria-label="الصورة التالية">
            <i class="fas fa-chevron-left"></i>
        </button>

    </div>

   
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="../script.js"></script>
    <script src="../baby-birthday-gallery.js"></script>
    

    



</body>

</html>
