<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>معرض صور عيد ميلاد اطفال | Nour Photography</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


</head>

<body class="gallery-page">


    <main class="graduation-gallery">

        <header class="gallery-header">

            <a href="../index.html#portfolio" class="gallery-back">
                <i class="fas fa-arrow-right"></i>
                العودة إلى الأعمال
            </a>

            <h1 class="gallery-title"> منتجات</h1>

            <p class="gallery-subtitle">
            لكل منتج جماله، ولكل تفصيلة سحرها
            </p>

            <div class="gallery-decoration"></div>

        </header>

        <section class="photo-grid" aria-label="صور منتجات">

            <button class="photo-item" type="button">
                <img src="../images/products/pro1.jpeg" alt="صورة  منتجات 1" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/products/pro10.jpeg" alt="صورة عيدميلاد منتجات 2" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/products/pro2.jpeg" alt="صورة  عيدميلاد منتجات 3" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/products/pro3.jpeg" alt="صورة عيدميلاد منتجات 4" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/products/pro4.jpeg" alt="صورة عيدميلاد منتجات 5" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/products/pro5.jpeg" alt="صورة عيدميلاد منتجات 6" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/products/pro6.jpeg" alt="صورة عيدميلاد منتجات 7" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/products/pro7.jpeg" alt="صورة عيدميلاد منتجات 8" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/products/pro8.jpeg" alt="صورة عيدميلاد منتجات 9" loading="lazy">
            </button>
            <button class="photo-item" type="button">
                <img src="../images/products/pro9.jpeg" alt="صورة عيدميلاد منتجات 10" loading="lazy">
            </button>
            <button class="photo-item" type="button">
                <img src="../images/products/pro11.jpeg" alt="صورة عيدميلاد منتجات 11" loading="lazy">
            </button>
        </section>

    </main>

    <!-- نافذة تكبير الصور -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصورة بحجم كبير">

        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="إغلاق">
            &times;
        </button>

        <button class="lightbox-prev" id="lightboxPrev" type="button" aria-label="الصورة السابقة">
            <i class="fas fa-chevron-right"></i>
        </button>

        <img class="lightbox-image" id="lightboxImage" src="" alt="">

        <button class="lightbox-next" id="lightboxNext" type="button" aria-label="الصورة التالية">
            <i class="fas fa-chevron-left"></i>
        </button>

    </div>

    <script src="../script.js"></script>


</body>

</html>
