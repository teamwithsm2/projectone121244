<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<body class="gallery-page">

    ```
    <main class="graduation-gallery">

        <header class="gallery-header">

            <a href="../index.html#portfolio" class="gallery-back">
                <i class="fas fa-arrow-right"></i>
                العودة إلى الأعمال
            </a>

            <h1 class="gallery-title">لحظات التخرج</h1>

            <p class="gallery-subtitle">
            قبعة التخرج، ابتسامة الفخر، وذكرى تبقى للأبد</p>

            <div class="gallery-decoration"></div>

        </header>

        <section class="photo-grid" aria-label="صور التخرج">

            <button class="photo-item" type="button">
                <img src="../images/graduation/grad1.jpeg" alt="صورة تخرج 1" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/graduation/grad2.jpeg" alt="صورة تخرج 2" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/graduation/grad3.jpeg" alt="صورة تخرج 3" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/graduation/grad4.jpeg" alt="صورة تخرج 4" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/graduation/grad5.jpeg" alt="صورة تخرج 5" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/graduation/grad7.jpeg" alt="صورة تخرج 6" loading="lazy">
            </button>
            <button class="photo-item" type="button">
                <img src="../images/graduation/grad8.jpeg" alt="صورة تخرج 6" loading="lazy">
            </button>
            <button class="photo-item" type="button">
                <img src="../images/graduation/grad6.jpeg" alt="صورة تخرج 6" loading="lazy">
            </button>
            <button class="photo-item" type="button">
                <img src="../images/graduation/grad9.jpeg" alt="صورة تخرج 6" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/graduation/grad10.jpeg" alt="صورة تخرج 6" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/graduation/grad11.jpeg" alt="صورة تخرج 6" loading="lazy">
            </button>

            <button class="photo-item" type="button">
                <img src="../images/graduation/grad12.jpeg" alt="صورة تخرج 6" loading="lazy">
            </button>

        </section>

    </main>

    <!-- نافذة تكبير الصور -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصورة بحجم كبير">

        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="إغلاق">
            &times;
        </button>

        <button class="lightbox-prev" id="lightboxPrev" type="button" aria-label="الصورة السابقة">
            <i class="fas fa-chevron-right"></i>
        </button>

        <img class="lightbox-image" id="lightboxImage" src="" alt="">

        <button class="lightbox-next" id="lightboxNext" type="button" aria-label="الصورة التالية">
            <i class="fas fa-chevron-left"></i>
        </button>

    </div>

    <script src="../script.js"></script>


</body>

</html>
