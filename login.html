<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة | نور للتصوير</title>

    <!-- استدعاء مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #835c6a;
            --hover: #6e4b58;
            --background: #f7f3f4;
            --text: #30272b;
            --muted: #81767b;
            --border: #e8dfe3;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: grid;
            place-items: center;
            background: var(--background);
            color: var(--text);
            font-family: Tahoma, Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 36px 30px 26px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 18px 55px #492b3710;
            text-align: center;
        }

        .brand-mark {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: var(--primary);
            color: #fff;
            font: 31px Georgia, serif;
        }

        .brand-name {
            color: var(--primary);
            font-size: 10px;
            letter-spacing: 3px;
            direction: ltr;
        }

        h1 {
            margin: 16px 0 8px;
            font-size: 25px;
        }

        .intro {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.9;
        }

        form {
            margin-top: 26px;
            text-align: right;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            min-height: 47px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px #835c6a20;
        }

        button {
            width: 100%;
            min-height: 47px;
            margin-top: 23px;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: var(--hover);
        }

        button:disabled {
            background: var(--muted);
            cursor: not-allowed;
        }

        #message {
            min-height: 20px;
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }

        #message.error {
            color: #b42318;
        }

        #message.success {
            color: #18794e;
        }

        .privacy-note {
            margin-top: 22px;
            padding-top: 17px;
            border-top: 1px solid #f0e9ec;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 21px 23px;
            }
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand-mark">N</div>
        <p class="brand-name">NOUR PHOTOGRAPHY</p>
        <h1>لوحة الإدارة</h1>
        <p class="intro">أهلًا نور، سجّلي الدخول لإدارة معرض صورك.</p>

        <form id="loginForm">
            <!-- استبدال اسم المستخدم بالبريد الإلكتروني -->
            <label for="email">البريد الإلكتروني</label>
            <input id="email" name="email" type="email" placeholder="أدخلي البريد الإلكتروني" autocomplete="email"
                required>

            <label for="password">كلمة المرور</label>
            <input id="password" name="password" type="password" placeholder="أدخلي كلمة المرور"
                autocomplete="current-password" required>

            <button id="loginButton" type="submit">تسجيل الدخول</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="privacy-note">🔒 مساحة خاصة بإدارة الصور</p>
    </main>

    <script>
        // القيم المأخوذة من مشروعك
        const SUPABASE_URL = 'https://wlrrudwtvaayfxhbcyih.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HLSqrmp2JVGe4T-dz0UWWA_wcKCY4P_'; // ضعي المفتاح كامل هنا

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const messageEl = document.getElementById('message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginButton.disabled = true;
            loginButton.textContent = 'جاري التحقق...';
            messageEl.textContent = '';
            messageEl.className = '';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                messageEl.textContent = 'تم تسجيل الدخول بنجاح! جاري التوجيه...';
                messageEl.className = 'success';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                messageEl.textContent = 'خطأ: البريد الإلكتروني أو كلمة المرور غير صحيحة.';
                messageEl.className = 'error';
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = 'تسجيل الدخول';
            }
        });
    </script>
</body>

</html>
